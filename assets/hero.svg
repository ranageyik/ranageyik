<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rana Geyik — Designer, Developer and Entrepreneur</title>
  <desc id="desc">Forest-green research banner with canopy branches, moss accents and Rana Geyik's professional identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070f0a"/>
      <stop offset="0.55" stop-color="#0d1812"/>
      <stop offset="1" stop-color="#14241a"/>
    </linearGradient>
    <radialGradient id="glowMoss" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 90) rotate(90) scale(280 220)">
      <stop stop-color="#a8c94a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a8c94a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCanopy" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 80) rotate(90) scale(320 260)">
      <stop stop-color="#2f5c3a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f5c3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowFloor" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 360) rotate(90) scale(260 180)">
      <stop stop-color="#1f3d2a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#1f3d2a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#6f9a45" stroke-opacity="0.08"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <ellipse cx="220" cy="90" rx="280" ry="220" fill="url(#glowMoss)"/>
    <ellipse cx="980" cy="80" rx="320" ry="260" fill="url(#glowCanopy)"/>
    <ellipse cx="160" cy="360" rx="260" ry="180" fill="url(#glowFloor)"/>

    <!-- Upper-right canopy branches -->
    <g opacity="0.85" filter="url(#soft)">
      <path d="M760 10 C820 55 870 110 900 180 C920 230 950 275 1015 315" stroke="#1f3d2a" stroke-width="1.6" fill="none"/>
      <path d="M900 180 C860 165 820 175 780 205" stroke="#1f3d2a" stroke-width="1.25" fill="none"/>
      <path d="M875 130 C920 112 965 128 1005 100" stroke="#2f5c3a" stroke-width="1.25" fill="none"/>
      <path d="M940 250 C985 232 1030 248 1075 220" stroke="#2f5c3a" stroke-width="1.15" fill="none"/>
      <ellipse cx="778" cy="210" rx="18" ry="9" transform="rotate(-38 778 210)" fill="#6f9a45" opacity="0.45"/>
      <ellipse cx="812" cy="192" rx="14" ry="7" transform="rotate(16 812 192)" fill="#6f9a45" opacity="0.4"/>
      <ellipse cx="1000" cy="108" rx="16" ry="8" transform="rotate(-22 1000 108)" fill="#6f9a45" opacity="0.42"/>
      <ellipse cx="1028" cy="128" rx="12" ry="6" transform="rotate(24 1028 128)" fill="#6f9a45" opacity="0.38"/>
      <ellipse cx="1070" cy="228" rx="15" ry="7.5" transform="rotate(-16 1070 228)" fill="#6f9a45" opacity="0.4"/>
      <ellipse cx="1095" cy="248" rx="11" ry="5.5" transform="rotate(28 1095 248)" fill="#6f9a45" opacity="0.34"/>
      <ellipse cx="920" cy="158" rx="13" ry="6.5" transform="rotate(8 920 158)" fill="#6f9a45" opacity="0.32"/>
      <circle cx="860" cy="120" r="2.2" fill="#c9a227" opacity="0.45"/>
      <circle cx="1045" cy="190" r="1.8" fill="#c9a227" opacity="0.4"/>
    </g>

    <!-- Lower-left branches -->
    <g opacity="0.7" filter="url(#soft)">
      <path d="M-10 380 C90 345 170 310 230 250 C270 210 310 185 370 168" stroke="#1f3d2a" stroke-width="1.5" fill="none"/>
      <path d="M230 250 C190 232 150 242 110 270" stroke="#2f5c3a" stroke-width="1.2" fill="none"/>
      <path d="M310 190 C350 172 390 182 430 158" stroke="#1f3d2a" stroke-width="1.15" fill="none"/>
      <ellipse cx="108" cy="274" rx="14" ry="7" transform="rotate(34 108 274)" fill="#6f9a45" opacity="0.4"/>
      <ellipse cx="136" cy="256" rx="11" ry="5.5" transform="rotate(-14 136 256)" fill="#6f9a45" opacity="0.35"/>
      <ellipse cx="368" cy="174" rx="15" ry="7.5" transform="rotate(-24 368 174)" fill="#6f9a45" opacity="0.4"/>
      <ellipse cx="398" cy="160" rx="12" ry="6" transform="rotate(18 398 160)" fill="#6f9a45" opacity="0.36"/>
      <ellipse cx="426" cy="164" rx="10" ry="5" transform="rotate(-8 426 164)" fill="#6f9a45" opacity="0.3"/>
      <circle cx="250" cy="220" r="2" fill="#c9a227" opacity="0.35"/>
    </g>

    <!-- Status pill -->
    <g transform="translate(72 58)">
      <rect x="0" y="0" width="132" height="28" rx="14" fill="#0b1510" stroke="#2f5c3a" stroke-opacity="0.7"/>
      <circle cx="18" cy="14" r="4" fill="#a8c94a"/>
      <text x="32" y="18" fill="#a8c94a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6">BUILD MODE</text>
    </g>

    <!-- Identity -->
    <text x="72" y="168" fill="#e6e2d6" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="-1.5">RANA GEYIK</text>
    <text x="74" y="208" fill="#9a9a88" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" letter-spacing="3.2">DESIGNER × DEVELOPER × ENTREPRENEUR</text>

    <!-- Tags -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2">
      <rect x="72" y="236" width="168" height="30" rx="15" fill="none" stroke="#6f9a45" stroke-opacity="0.85"/>
      <text x="156" y="255" text-anchor="middle" fill="#a8c94a">AI-NATIVE SYSTEMS</text>

      <rect x="252" y="236" width="148" height="30" rx="15" fill="none" stroke="#2f5c3a"/>
      <text x="326" y="255" text-anchor="middle" fill="#e6e2d6">PRODUCT BUILDER</text>

      <rect x="412" y="236" width="138" height="30" rx="15" fill="none" stroke="#1f3d2a"/>
      <text x="481" y="255" text-anchor="middle" fill="#9a9a88">CREATIVE TECH</text>
    </g>

    <!-- Now building card -->
    <g transform="translate(820 278) rotate(-7)">
      <rect x="0" y="0" width="250" height="72" rx="14" fill="#0b1510" stroke="#c9a227" stroke-opacity="0.7"/>
      <text x="22" y="32" fill="#c9a227" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">NOW BUILDING</text>
      <text x="22" y="54" fill="#e6e2d6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700">BIZMOTO ↗</text>
    </g>

    <!-- Bottom signal line -->
    <path d="M72 340 C220 328 340 352 480 336 C640 318 780 348 980 330" stroke="#6f9a45" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="6 10" fill="none"/>
  </g>
</svg>
